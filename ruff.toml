# Ruff configuration for Mewtoo
# https://docs.astral.sh/ruff/configuration/

target-version = "py39"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict= (Python 3.10+)
    "SIM108", # ternary operator suggestion
]

[lint.per-file-ignores]
"tests/*" = ["B011", "B017", "S101"]  # Allow assert, pytest patterns
"__init__.py" = ["F401"]              # Allow unused imports in __init__

[lint.isort]
known-first-party = ["pokemon_agent", "game_state", "memory_reader", "llm_provider", "config", "metrics"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
