# Ruff configuration for Mewtoo
# https://docs.astral.sh/ruff/configuration/

target-version = "py39"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file
    "E722",   # bare except (existing code pattern)
    "E741",   # ambiguous variable name
    "W291",   # trailing whitespace
    "W293",   # blank line contains whitespace
    "B007",   # loop control variable not used
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise from err (existing code pattern)
    "B905",   # zip without strict= (Python 3.10+)
    "F401",   # imported but unused (too noisy for existing code)
    "F541",   # f-string without placeholders
    "F811",   # redefinition of unused name
    "F841",   # local variable assigned but never used
]

[lint.per-file-ignores]
"tests/*" = ["B011", "B017", "S101", "B007"]  # Allow assert, pytest patterns, unused loop vars
"scripts/*" = ["F541"]                         # Allow f-strings without placeholders
"__init__.py" = ["F401"]                       # Allow unused imports in __init__

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
